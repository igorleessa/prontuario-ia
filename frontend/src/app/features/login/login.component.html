<div class="login">
  <div class="login__cartao cartao">
    <div class="cartao__corpo">
      <span class="login__simbolo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h3l2.5 6 4-14L15 12h6" />
        </svg>
      </span>

      <h1>Prontuário IA</h1>
      <p class="login__subtitulo">Entre para registrar e revisar seus atendimentos.</p>

      <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
        <div class="campo">
          <label class="campo__rotulo" for="email">E-mail</label>
          <input id="email" type="email" formControlName="email" autocomplete="username"
                 placeholder="voce@clinica.com.br" />
        </div>

        <div class="campo">
          <label class="campo__rotulo" for="senha">Senha</label>
          <input id="senha" type="password" formControlName="senha" autocomplete="current-password"
                 placeholder="••••••••" />
        </div>

        @if (erro()) {
          <p class="aviso aviso--erro" role="alert">{{ erro() }}</p>
        }

        <button type="submit" class="botao botao--bloco" [disabled]="form.invalid || enviando()">
          {{ enviando() ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>
    </div>
  </div>
</div>
