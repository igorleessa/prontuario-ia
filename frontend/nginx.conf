server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O backend é alcançado pelo nome do serviço na rede do Compose, então a
    # porta publicada no host pode mudar sem afetar o bundle do frontend.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        # O audio de uma consulta inteira passa por aqui; o padrao (1 MB) corta.
        client_max_body_size 100m;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
