services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Reconhecimento de nomes da sanitizacao. Sem porta publicada: so o backend
  # o alcanca, pela rede interna do compose, e o texto nao sai da maquina.
  privacidade-ner:
    build:
      context: ./servicos/privacidade-ner
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: src/Prontuario.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Partes separadas: o backend monta a connection string com o builder do
      # Npgsql, que escapa senhas contendo ";" ou "=".
      Postgres__Host: postgres
      Postgres__Port: "5432"
      Postgres__Database: ${POSTGRES_DB}
      Postgres__Username: ${POSTGRES_USER}
      Postgres__Password: ${POSTGRES_PASSWORD}
      Database__AplicarMigrationsNaInicializacao: "true"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-ProntuarioIA}
      Jwt__Audience: ${JWT_AUDIENCE:-ProntuarioIA.Clientes}
      Jwt__ExpiracaoMinutos: ${JWT_EXPIRACAO_MINUTOS:-60}
      Seed__Habilitado: ${SEED_HABILITADO:-true}
      Seed__Email: ${SEED_EMAIL}
      Seed__Senha: ${SEED_SENHA}
      Seed__NomeMedico: ${SEED_NOME_MEDICO:-Medico de Teste}
      Seed__NomeClinica: ${SEED_NOME_CLINICA:-Clinica de Teste}
      Seed__ModoOperacao: ${SEED_MODO_OPERACAO:-Integrado}
      Seed__EmailAdministrador: ${SEED_EMAIL_ADMIN}
      Seed__NomeAdministrador: ${SEED_NOME_ADMIN:-Administrador da Clinica}
      Cors__OrigensPermitidas__0: "http://localhost:${FRONTEND_PORT:-4200}"
      # Nenhum audio e gravado: a consulta e transcrita ao vivo. Com o tempo
      # real desligado (rede que bloqueia WebRTC com a OpenAI), o navegador
      # envia trechos de segundos, transcritos em memoria e descartados.
      Transcricao__TempoRealHabilitado: ${TRANSCRICAO_TEMPO_REAL:-true}
      # Reconhecedor de nomes local. Fora do ar, a fala e guardada com as outras
      # camadas da sanitizacao, mas nada vai para a IA ate ele voltar.
      Privacidade__Ner__Url: http://privacidade-ner:8000
      # PER (pessoas) por padrao; acrescente LOC e ORG para retirar lugares e organizacoes.
      Privacidade__Ner__Categorias: ${NER_CATEGORIAS:-PER}
      # Libera o botao "Simular consulta", que envia as falas de uma consulta
      # ficticia como se viessem da transcricao - a demonstracao nao depende de microfone.
      Demonstracao__Habilitado: ${DEMONSTRACAO_HABILITADA:-true}
      # Linha de base de documentacao manual usada no calculo de tempo economizado.
      Metricas__MinutosDocumentacaoManual: ${MINUTOS_DOCUMENTACAO_MANUAL:-7}
      # As chaves de API das clinicas sao cifradas com o Data Protection; o
      # chaveiro fica em volume para sobreviver a recriacao do container.
      DataProtection__Caminho: /chaves
      # Base usada para montar o link que o EMR do cliente abre para o medico.
      Integracao__UrlBaseFrontend: http://localhost:${FRONTEND_PORT:-4200}
    volumes:
      - dataprotection-keys:/chaves
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      privacidade-ner:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend

  # EMR ficticio para demonstrar a Modalidade B ponta a ponta: recebe a nota
  # pelo webhook e a exibe como se fosse o prontuario do cliente.
  emr-demo:
    build:
      context: ./backend
      dockerfile: src/Prontuario.EmrDemo/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Webhook__Secret: ${EMR_DEMO_SECRET:-segredo-de-demonstracao}
    ports:
      - "${EMR_DEMO_PORT:-9080}:8080"

volumes:
  postgres-data:
  dataprotection-keys:
